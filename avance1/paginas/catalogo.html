<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de iniciativas — Innovation Hub</title>
<link rel="stylesheet" href="../estilos/styles.css">
</head>
<body>

<header class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container">
    <a href="../index.html" class="navbar-brand fw-bold">Innovation Hub</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navPrincipal" aria-controls="navPrincipal" aria-expanded="false" aria-label="Abrir navegación">
      <span class="navbar-toggler-icon"></span>
    </button>
    <nav class="collapse navbar-collapse" id="navPrincipal" aria-label="Principal">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="catalogo.html">Catálogo</a></li>
        <li class="nav-item"><a class="nav-link" href="publicar.html">Publicar iniciativa</a></li>
        <li class="nav-item"><a class="nav-link" href="proyectos.html">Proyectos</a></li>
        <li class="nav-item"><a class="nav-link" href="perfil.html">Mi perfil</a></li>
        <li class="nav-item"><a class="nav-link" href="solicitudes.html">Mis solicitudes</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="container py-4">
  <h1 class="h2 mb-4">Catálogo de iniciativas</h1>

  <div class="row g-4">

    <aside class="col-lg-3" aria-labelledby="titulo-filtros">
      <div class="card">
        <div class="card-body">
          <h2 id="titulo-filtros" class="h5 card-title">Filtrar iniciativas</h2>
          <form>
            <div class="mb-3">
              <label for="filtro-texto" class="form-label">Buscar por texto</label>
              <input type="search" id="filtro-texto" name="texto" class="form-control">
            </div>
            <div class="mb-3">
              <label for="filtro-tipo" class="form-label">Tipo</label>
              <select id="filtro-tipo" name="tipo" class="form-select">
                <option value="">Todos</option>
                <option value="idea">Idea</option>
                <option value="necesidad">Necesidad</option>
                <option value="reto">Reto</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="filtro-categoria" class="form-label">Categoría</label>
              <select id="filtro-categoria" name="categoria" class="form-select">
                <option value="">Todas</option>
                <option value="educacion">Educación</option>
                <option value="ambiente">Ambiente</option>
                <option value="comunidad">Gestión comunitaria</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="filtro-competencia" class="form-label">Competencia requerida</label>
              <input type="text" id="filtro-competencia" name="competencia" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary w-100">Aplicar filtros</button>
          </form>
        </div>
      </div>
    </aside>

    <section class="col-lg-9" aria-labelledby="titulo-resultados">
      <h2 id="titulo-resultados" class="h5 mb-3"><span id="cantidad-resultados">8</span> iniciativas encontradas</h2>
      <p id="mensaje-sin-resultados" class="text-muted d-none">Ninguna iniciativa coincide con tu búsqueda.</p>

      <div class="row row-cols-1 row-cols-md-2 g-4" id="contenedor-resultados"></div>

    </section>

  </div>
</main>

<footer class="bg-dark text-white text-center py-3 mt-4">
  <p class="mb-1">Innovation Hub · Universidad CENFOTEC</p>
  <p class="mb-0"><a href="mailto:hub@ejemplo.ac.cr" class="text-white">hub@ejemplo.ac.cr</a></p>
</footer>

<script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/catalogo.js"></script>
</body>
</html>
